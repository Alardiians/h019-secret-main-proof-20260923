name: Owned H019 dot consumer

on:
  workflow_run:
    workflows: [Owned H019 dot producer]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  consume:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'pull_request' &&
          github.event.workflow_run.actor.login == 'alardiianstest' &&
          github.event.workflow_run.head_repository.full_name == 'alardiianstest/h019-secret-main-proof-20260923' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out fixed main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Record trusted checkout before download
        shell: bash
        run: |
          printf 'SOURCE_RUN_ID=%s\n' '${{ github.event.workflow_run.id }}'
          printf 'BASE_SCRIPT_SHA256='; sha256sum scripts/verify.sh | cut -d' ' -f1
      - name: Download all artifacts to isolated runner temp
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/h019-isolated-artifacts
          merge-multiple: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Verify checked-out script was not changed
        shell: bash
        run: |
          printf 'FINAL_SCRIPT_SHA256='; sha256sum scripts/verify.sh | cut -d' ' -f1
          git diff --quiet -- scripts/verify.sh
          printf 'ISOLATED_CONTROL=trusted_checkout_unchanged\n'
